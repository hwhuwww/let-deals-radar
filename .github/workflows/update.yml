name: Update deals

# 瀹氭椂鎶撳彇 鈫?鐢熸垚绔欑偣 鈫?鎻愪氦鍥炰粨搴?鈫?閮ㄧ讲鍒?GitHub Pages
#
# 鏈枃浠跺熀浜庡師鐗?update.yml 淇敼锛氭柊澧?GitHub Pages 鑷姩閮ㄧ讲锛堟湯灏句袱姝ワ級锛?# 骞跺湪 permissions 涓?job environment 涓ˉ鍏?Pages 鎵€闇€鏉冮檺銆?# 鍓嶇疆鏉′欢锛堢綉椤典笂涓€娆℃€ц缃級锛?#   浠撳簱 Settings 鈫?Pages 鈫?Build and deployment 鈫?Source 閫夈€孏itHub Actions銆?
on:
  schedule:
    # 姣?6 灏忔椂涓€娆★紙UTC锛夈€侴itHub 鐨?cron 鍦ㄩ珮璐熻浇鏃跺彲鑳藉欢鍚庡嚑鍒嗛挓锛屽睘姝ｅ父銆?    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      with_replies:
        description: '鎶撳彇鍥炲笘锛堝簱瀛樻洿鍑嗭紝鑰楁椂鏇撮暱锛?
        type: boolean
        default: true
      recent_days:
        description: '鍙繚鐣欐渶杩?N 澶╋紙0=鍏ㄩ儴锛?
        type: string
        default: '90'

permissions:
  contents: write
  pages: write
  id-token: write

# 閬垮厤涓婁竴娆℃湭璺戝畬鏃堕噸澶嶈Е鍙?concurrency:
  group: update-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Fetch, extract and build site
        env:
          # 绔欑偣涓庡煙鍚嶉厤缃紙鍦ㄤ粨搴?Settings 鈫?Variables 涓缃紝鍙笉閰嶏級
          LDR_SITE_TITLE: ${{ vars.LDR_SITE_TITLE }}
          LDR_SITE_URL: ${{ vars.LDR_SITE_URL }}
          LDR_SITE_DESC: ${{ vars.LDR_SITE_DESC }}
          LDR_SITE_FOOTER: ${{ vars.LDR_SITE_FOOTER }}
          # 鎶撳彇鍙傛暟锛氭墜鍔ㄨЕ鍙戞椂鐢ㄨ緭鍏ュ€硷紝瀹氭椂瑙﹀彂鏃剁敤榛樿鍊?          WITH_REPLIES: ${{ github.event.inputs.with_replies || '1' }}
          RECENT_DAYS: ${{ github.event.inputs.recent_days || '90' }}
          PYTHON: python
        run: bash deploy/run_pipeline.sh

      - name: Verify output is non-empty
        # 瀹夊叏缃戯細鎶撳彇澶辫触鎴栧叏閮ㄨ杩囨护鏃讹紝鎷掔粷鎻愪氦锛屼繚鐣欎笂娆＄嚎涓婃暟鎹?        run: |
          COUNT=$(python -c "import json;print(json.load(open('data/deals.json'))['count'])")
          echo "璁板綍鏁? $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::璁板綍鏁颁负 0锛屾嫆缁濇彁浜わ紙淇濈暀涓婃鏁版嵁锛?
            exit 1
          fi

      - name: Upload for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Post to forum
        # 鎼繍浼樻儬甯栧埌 Flarum 璁哄潧銆傞粯璁ゅ叧闂紝涓嶉厤缃氨鏄彧鎵撳嵃銆屽凡鍏抽棴銆嶃€?        env:
          LDR_FORUM_ENABLED: ${{ vars.LDR_FORUM_ENABLED || 'false' }}
          LDR_FORUM_DRY_RUN: ${{ vars.LDR_FORUM_DRY_RUN || 'true' }}
          LDR_FORUM_API_KEY: ${{ secrets.LDR_FORUM_API_KEY }}
          LDR_FORUM_URL: ${{ vars.LDR_FORUM_URL || 'https://lowseek.ai' }}
          LDR_FORUM_TAG_ID: ${{ vars.LDR_FORUM_TAG_ID || '21' }}
          LDR_FORUM_MAX_PER_RUN: ${{ vars.LDR_FORUM_MAX_PER_RUN || '3' }}
          LDR_FORUM_MAX_AGE_DAYS: ${{ vars.LDR_FORUM_MAX_AGE_DAYS || '3' }}
          LDR_FORUM_MIN_PERCENT: ${{ vars.LDR_FORUM_MIN_PERCENT || '30' }}
        # 璇讳笂涓€姝ョ敓鎴愮殑 deals.json锛屼笉閲嶅鎶撳彇
        run: python -m letdeals --forum-only

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # forum_posted.json 鏄箓绛変緷鎹紝蹇呴』鎻愪氦锛涗絾瀹冨彧鍦ㄧ湡姝ｅ彂杩囧笘鏃?          # 鎵嶅瓨鍦ㄣ€傛枃浠朵笉瀛樺湪鏃惰嫢鐩存帴 git add 浼氭姤
          # "pathspec did not match"锛屽洜姝ゅ厛鍒ゆ柇鍐嶆坊鍔犮€?          add_all() {
            git add data/deals.json data/deals.md site/
            if [ -f data/forum_posted.json ]; then
              git add data/forum_posted.json
            fi
          }

          add_all
          if git diff --staged --quiet; then
            echo "鏃犲彉鍖栵紝璺宠繃鎻愪氦"
            exit 0
          fi
          git commit -m "chore: refresh deals [skip ci]"

          # 杩滅鍙兘宸茶鍙︿竴娆¤繍琛屾帹杩涳紙鎵嬪姩閲嶈窇銆乧ron 寤惰繜绛夛級锛?          # 鐩存帴 push 浼氬洜闈炲揩杩涜€岃鎷掋€傚仛娉曪細鎶?HEAD 绉诲埌杩滅鏈€鏂版彁浜わ紝
          # 淇濈暀鎴戜滑鍒氱敓鎴愮殑鏁版嵁锛堣繖浜涙槸浜х墿锛屾案杩滀互鏈€鏂颁竴娆′负鍑嗭級锛?          # 鍦ㄥ叾涔嬩笂閲嶆柊鎻愪氦锛屼粠鑰屽缁堟槸蹇繘鎺ㄩ€併€?          git fetch origin main
          git reset --soft origin/main
          add_all
          if git diff --staged --quiet; then
            echo "涓庤繙绔竴鑷达紝鏃犻渶鎻愪氦"
          else
            git commit -m "chore: refresh deals [skip ci]"
          fi
          git push
